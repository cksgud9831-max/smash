# final_v20 uses a TensorRT engine and therefore depends on the Jetson/TensorRT
# environment where that engine was built. A different Jetson or TensorRT
# version may require rebuilding the engine.
#
# FinalTracker keeps its validated runtime constants in code rather than YAML:
# imgsz=(384, 640), SEARCH interval=5, SEARCH_CONFIRM_HITS=2, and TRACK
# periodic correction interval=20.

camera:
  intrinsics:
    fx: 500.0
    fy: 500.0
    cx: 320.0
    cy: 240.0

laser:
  # Calibration placeholder, identical to the legacy development config.
  mount_offset_m: {x: 0.0, y: 0.0, z: 0.0}
  sensor: mock
  mock:
    fixed_distance_m: 250.0
  serial:
    port: null
    baud_rate: 115200
    min_signal_strength: 100
    read_timeout_s: 0.3

pose:
  # Calibration placeholder, identical to the legacy development config.
  source: mock
  mock:
    extrinsic: identity
  bno08x:
    i2c_bus: 1
    i2c_address: 0x4A
    report_type: game_rotation_vector
    mount_rotation_rad: {roll: 0.0, pitch: 0.0, yaw: 0.0}
    fixed_position_m: {x: 0.0, y: 0.0, z: 0.0}
    read_timeout_s: 0.2

tracker:
  backend: final_v20
  model_path: detector+tracker/final/models/ga_yolo11s_960_best.engine
  device: "0"
  conf_thres: 0.25  # Retained for schema compatibility; FinalTracker uses its validated constant.

# Currently unused by TrackerFrameBuilder; retained unchanged for config compatibility.
detector:
  backend: onnx
  onnx:
    weights_path: bridge/weights/base_416.onnx
    imgsz: [416, 416]
    conf_thres: 0.25
    iou_thres: 0.45
  trt:
    engine_path: null
