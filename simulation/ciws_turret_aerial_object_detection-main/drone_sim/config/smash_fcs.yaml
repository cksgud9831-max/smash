# SMASH FCS 통합 노드 파라미터 (로드맵 1단계)
#
# ★ 무기 전제
#   SMASH 의 실제 제품은 5.56mm 개인화기에 장착하는 스마트 조준경이다. 서보로 총을
#   돌리는 무기가 아니라 사수에게 조준점을 알려 주는 자문 장비다. Gazebo 의 CIWS
#   포탑은 참고 오픈소스에서 빌려 온 3D 비행 환경이고, Pan/Tilt 서보는 사수가 총을
#   겨누는 동작의 시뮬레이션 대체물이다. 제품 기능이 아니다.
#   따라서 아래 탄도와 기하 값은 전부 포탑이 아니라 소총 제원을 따른다.
#
# 실행 예:
#   ros2 launch drone_sim smash_scene.launch.py \
#       core_path:=/mnt/d/Aiming \
#       model_path:=/mnt/d/Aiming/detector+tracker/ga_results/yolo11s_ga_final-3/weights/best.pt
#
# 여기 값들은 런치 인자로 덮어쓸 수 있다.

smash_fcs:
  ros__parameters:
    use_sim_time: true

    # ── 조준 코어 위치 ────────────────────────────────────────────────
    # SMASH 코어 저장소 루트. 파이썬 패키지는 <core_path>/smash_core/ 아래에 있다
    # (aiming_engine, bridge, jun_reliability).
    # 비워 두면 환경변수 SMASH_CORE_PATH 를 사용한다.
    # WSL2 에서 D 드라이브를 쓰는 경우 예: /mnt/d/Aiming
    core_path: ""
    # 비워 두면 <core_path>/config/aiming_engine.yaml 을 읽는다.
    aiming_config_path: ""

    # ── 추적기 ────────────────────────────────────────────────────────
    # 추적기 가중치. 반드시 지정해야 한다.
    # 본 시뮬레이터는 "학습 → 탐지 → 추적 → 조준" 전 파이프라인을 하나로 검증하는 것이
    # 목적이므로, 우리가 GA 튜닝으로 직접 학습시킨 산출물을 그대로 사용한다:
    #   detector+tracker/ga_results/yolo11s_ga_final-3/weights/best.pt
    # run_smash_fcs.bat / wsl_setup_smash_fcs.sh 가 이 경로를 자동으로 넘긴다.
    model_path: ""
    device: "cpu"          # GPU 사용 시 "0"
    conf_thres: 0.25
    # 모델 초기화/첫 추론 비용은 별도 worker에서 미리 지불한다. 이 동안 영상
    # 콜백은 막히지 않으며, warm-up 완료 뒤 최신 프레임으로 첫 포착을 시작한다.
    detector_warmup: true
    # 늦은 검출 결과가 현재 추적 위치를 오염시키지 않게 버린다. CUDA 운용값은
    # 1 s다. CPU 프로파일에서는 1.2~4.5 s가 걸려 이 기준을 만족하지 못했으므로,
    # CPU는 기능 검증용일 뿐 이동 표적 운용 경로로 사용하지 않는다.
    detector_result_max_age_s: 1.0
    detector_periodic_interval_frames: 10
    detector_async_compensation_max_px: 6.0
    # 추적기 특징점 추출 문턱. 0 = 추적기 내장 기본값(qualityLevel 0.01, blockSize 7).
    # 35 m 소형 표적(44x17 px)은 내장 기본값에서 특징점이 7~9개라 최소 기준(6)에 걸려 low_features 복구가
    # 반복되고 bbox 가 15 px 씩 튀었다(2026-10-03 재생). 0.0005 / 3 이면 13개로 복구가 사라진다.
    # 사용자 조건(straight 3 km/h, 화각 0.2) 실측 A/B: 수평 오차 표준편차 15.3 -> 3.7~4.7 px, 95% 33.7 -> 7~9 px,
    # 최대 83 -> 11~13 px. 느린 cross 1 km/h 에서는 변화 없음. 0 으로 두면 이전 동작이다.
    detector_feature_quality_level: 0.0005
    detector_feature_block_size: 3

    # ── 토픽 ──────────────────────────────────────────────────────────
    image_topic: "/turret_camera/image_raw"
    camera_info_topic: "/turret_camera/camera_info"
    # gpu_lidar 는 <topic> 으로 LaserScan(가운데 행)을, <topic>/points 로
    # PointCloudPacked(전체 격자)를 낸다. 원뿔 전체가 필요하므로 후자를 쓴다.
    laser_topic: "/turret_camera/boresight_range/points"
    annotated_topic: "/turret_camera/image_annotated"
    state_topic: "/smash_fcs/state"

    # ── 좌표계 ────────────────────────────────────────────────────────
    # base_footprint 은 포탑 고정 관성계이며 Z 축이 위다. aiming_engine 의
    # World 프레임 요구조건(관성, Z-up)을 만족하므로 그대로 쓴다. Gazebo world
    # 원점과 스폰 오프셋만큼 차이가 나지만 표적 위치도 같은 프레임에서 나오므로
    # 조준 계산에는 영향이 없다.
    base_frame: "base_footprint"
    camera_optical_frame: "camera_link_optical"
    # 0 이어야 한다(기다리지 않음). rclpy 의 Buffer 는 timeout 동안 sleep 으로 폴링하며
    # 실행기를 막는데, 이 노드는 단일 스레드 실행기라 그동안 /tf 콜백이 돌지 못해
    # 기다려도 변환이 절대 들어오지 않는다. 0.05 였을 때 프레임마다 약 60 ms 를 헛되이
    # 기다렸고(영상 콜백 130 ms 중 절반), 명령·격발 타이머까지 굶었다(2026-09-18 실측).
    tf_timeout_s: 0.0

    # ── 탄도 (5.56 x 45mm M855, 62 gr) ────────────────────────────────
    # 가장 범용적인 14.5인치 M4 카빈 총열 기준 총구초속 약 880 m/s 적용.
    # (참고: 20인치 총열은 약 920 m/s, M193 55 gr 탄약은 약 990 m/s 수준)
    muzzle_velocity_mps: 880.0
    enable_drag: true
    # M855 탄두 질량 62 gr = 4.02 g.
    projectile_mass_kg: 0.00402
    # 5.56 탄의 실제 탄두 직경(강선 홈 기준)은 5.70 mm 다. 구경 표기 5.56 은
    # 강선 산 기준이라 공력 계산에는 맞지 않는다.
    projectile_diameter_m: 0.00570
    # M855 는 보트테일 스피처이므로 평저탄용 G1 보다 G7 계열이 형상에 가깝다.
    #
    # 주의: aiming_engine/forces.py 의 G1/G7 항력계수 표는 해당 파일 주석에 명시된
    # 대로 아직 1차 출처 검증이 끝나지 않은 근사치다. enable_drag 를 켜면 물리
    # 모델은 더 타당해지지만 절대 정확도는 이 표의 품질에 종속된다. 정량 보고서에
    # 이 한계를 병기해야 한다. 기존 Level 1/Level 2 검증 수치와 직접 비교할 때는
    # enable_drag 를 false 로 두어 중력만 켠 조건을 맞춰야 한다.
    #
    # 5.56 은 20mm 대비 단면밀도가 훨씬 낮아 항력 감속이 약 2배 크다.
    # (단위질량당 단면적 6.35e-3 대 3.08e-3 m^2/kg)
    # 즉 탄종을 바꾸면서 공기저항의 상대적 중요도도 함께 올라갔다.
    drag_model: "G7"

    # ── 조준경 기하 (제품 고유, 실제 소총 제원) ───────────────────────
    # 조준경 광학중심에서 본 총구 위치, FLU (X 전방, Y 좌측, Z 상방).
    #   [0] 0.45  : 조준경 광학중심에서 총구까지 전방 거리.
    #               시선에 평행하므로 시차 기여는 거의 없다. 실측하면 더 정확해진다.
    #   [1] 0.0   : 좌우. 조준경이 총열 바로 위에 정렬되어 있다고 본다.
    #   [2] -0.066: 조준경 광축과 총열 중심의 높이차(sight height over bore).
    #               AR 계열 플랫탑 상부레일 기준. 로우 마운트 구성은 -0.038 수준.
    #               이 값이 시차를 만드는 유일한 수직 항이며, 사거리 R 에서
    #               대략 0.066 / R [rad] 의 조준 오차에 대응한다.
    #                 35 m -> 1.9 mrad (0.108도)
    #                 10 m -> 6.6 mrad (0.38도)
    #               Gazebo 포탑 메시의 포신 끝 좌표와는 무관하며, 무관한 것이 맞다.
    scope_to_muzzle_m: [0.45, 0.0, -0.066]

    # ── 포탑 기하 (시뮬레이션 고유, URDF 유래) ────────────────────────
    # Gazebo 서보를 올바로 구동하기 위한 배선값일 뿐 제품 기하가 아니다.
    # camera_joint(-0.07, 0.05, 0.15) + camera_optical_joint(0.229, -0.05, 0.10)
    # 좌우 성분은 반드시 0 이어야 한다 — scope_to_muzzle_m 이 "조준경이 총열 바로
    # 위에 정렬(좌우 0)"을 전제하기 때문이다. 이전에는 URDF 가 광학중심을 좌우
    # +0.21 m 에 두어 전 사격이 좌우로 정확히 0.21 m 씩 빗나갔다(URDF 주석 참고).
    gun_to_camera_optical_m: [0.159, 0.0, 0.25]

    # ── 거리 추정 ─────────────────────────────────────────────────────
    # 바운딩박스 기하 역추정에 쓰는 표적 특성 크기(최대 투영 폭).
    #
    # 2026-09-12 실측 보정값. 이전 0.47 은 Gazebo Fuel "x3 uav" 로터 스팬의
    # 어림값으로 실측이 아니었다.
    #
    # ★ 메시 치수를 그대로 넣으면 안 된다. drone.stl 의 경계상자는
    #   0.3542 x 0.3542 x 0.0921 m 이고 대각선 투영폭은 0.5009 m 지만, 바운딩박스는
    #   대각선이 아니라 실루엣의 축정렬 폭을 재고 그 값은 표적 자세와 탐지기 성향에
    #   함께 좌우된다. 실제로 0.50 을 넣어 보니 35 m 에서 사거리 추정이 약 2.1 m
    #   길어져 계통 빗나감이 0.82 m -> 3.21 m 로 악화되었다(명중 0 발).
    #
    # 그래서 이 파일이 원래 적어 둔 절차대로 실측 보정했다. 35.0 m(경사거리)
    # 정지 표적에서 S=0.47 일 때 사거리 방향 계통 오차가 +0.813 m 였으므로
    #   S_correct = 0.47 * 35.03 / (35.03 + 0.813) = 0.459
    # 표적 자세나 탐지기 가중치를 바꾸면 이 값도 다시 보정해야 한다.
    target_characteristic_size_m: 0.459
    # 표적 크기 가정 자체의 상대 불확실도. 시선 방향에 따라 투영 폭이 달라지는
    # 계통오차를 포괄한다.
    target_size_uncertainty_ratio: 0.25
    bbox_pixel_sigma: 2.0
    range_min_m: 3.0
    range_max_m: 800.0
    # 단안 bbox 폭은 자세/검출 경계의 1~2 px 변화도 수 m/s의 가짜 방사속도로
    # 증폭한다. 같은 출처가 연속되는 동안 약 5프레임 EMA로 거리 성분을 안정화한다.
    # 출처 변경과 무효 측정에서는 HybridRangeEstimator가 이력을 초기화한다.
    range_smoothing_alpha: 0.2
    laser_noise_sigma_m: 0.02
    laser_staleness_timeout_s: 0.2
    # 레이저 값과 바운딩박스 추정값의 교차검증 게이트 폭(바운딩박스 sigma 배수).
    # 광각 원뿔이 표적이 아닌 다른 물체(다른 비행체, 조류, 저앙각의 지면)를 물었을 때
    # 걸러 내기 위한 안전장치다. 값을 키우면 레이저를 더 잘 채택하지만 오독 위험이
    # 커지고, 줄이면 반대가 된다.
    laser_cross_check_sigma: 3.0
    # 프레임 간 거리 급변 게이트의 물리 허용치. 게이트 폭은
    #   5 x sigma + max_range_rate_mps x dt
    # 로 계산한다. 측정 잡음만으로 게이트를 잡으면(레이저 sigma 2 cm) 실제로
    # 접근/이탈 중인 표적의 정상적인 거리 변화까지 이상치로 기각해 거리값이
    # 얼어붙는다. 로드맵 4단계의 15~20 m/s FPV 를 여유 있게 덮도록 60 m/s 로 둔다.
    max_range_rate_mps: 60.0

    # ── 표적 이탈 판정 ────────────────────────────────────────────────
    # 바운딩박스가 화면 가장자리에 border_frames_before_reset 프레임 연속으로
    # 닿으면 표적이 화면을 벗어난 것으로 보고 SEARCH 로 즉시 초기화한다.
    # OpticalFlowTracker 는 표적을 잃어도 스스로 포기하지 않으므로 이 판정이 없으면
    # 배경 텍스처를 계속 추종한다.
    border_margin_px: 2
    border_frames_before_reset: 3

    publish_annotated: true

    # ── 3단계: 가상 탄환 격발 및 Hit/Kill 판정 ──────────────────────────
    # 시뮬레이터는 자동 격발이 기본이다: READY 인 동안 fire_rate_rpm 쿨다운으로
    # 격발한다. false 면 탐지·조준만 하고 격발·판정을 하지 않는다(런처 4번).
    # aim_solution 이 있어야(즉 최소 AIM 상태) 격발한다 — 조준각 자체가 없는 상태에서
    # 가상 탄환을 만들 수는 없다. 설계 근거와 한계는 smash_fcs/fire_control.py 모듈
    # docstring 및 smash_fcs_node.py 상단 "3단계 범위와 경계" 절 참고.
    enable_fire_control: true
    # 5.56mm 소총 완전자동 사이클릭 발사속도의 근사(분당 발수). 쿨다운 간격
    # (60/fire_rate_rpm 초)으로 쓰인다.
    fire_rate_rpm: 700.0
    # 명중 판정 반경. 0 이하이면 target_characteristic_size_m / 2 로 자동 유도한다.
    #
    # 2026-09-12 실측으로 명시 지정했다. 자동 유도를 쓰지 않는 이유는 두 상수의
    # 용도가 다르기 때문이다.
    #   target_characteristic_size_m : 카메라가 "보는" 폭. 거리 역추정(R = f*S/s)용.
    #                                  로터를 포함한 최대 투영폭이 맞다(0.50 m).
    #   target_hit_radius_m          : 탄이 "맞는" 동체. 명중 판정용.
    #                                  로터 사이 빈 공간은 제외해야 한다.
    # 둘을 묶어 두면(자동 유도) 보이는 크기가 커질수록 명중 판정도 함께 느슨해져
    # 명중률이 실제보다 부풀려진다.
    #
    # drone_sim/models/drone/model.sdf 의 충돌 형상은 0.35 x 0.35 x 0.10 m 상자이며
    # 이것이 이 시뮬레이터에서 표적이 실제로 점유하는 부피다. 그 평면 단면
    # 0.35 x 0.35 와 같은 넓이를 갖는 원의 반지름 0.35/sqrt(pi) = 0.1975 m 를 쓴다.
    # 참고로 외접구 반지름은 0.2525 m 로 더 후하고, 부피 등가구는 0.1430 m 로 더 엄하다.
    #
    # ★ 이 값은 보고되는 명중률을 직접 좌우한다. 바꾸면 과거 수치와 비교할 수 없다.
    target_hit_radius_m: 0.1975
    fire_event_topic: "/smash_fcs/fire_event"
    hit_result_topic: "/smash_fcs/hit_result"
    engagement_stats_topic: "/smash_fcs/engagement_stats"
    # 격발 판단 및 Hit/Kill 판정을 도는 고정 주기. 영상 프레임(30Hz)과는 독립적으로
    # 돈다 — 표적을 놓친 동안에도 이미 비행 중인 탄환의 판정 시각은 실시간으로
    # 도래하기 때문이다.
    fire_control_rate_hz: 60.0
    target_motion_status_topic: "/target_mover/status"
    # launch가 이동 표적 시나리오일 때 true로 덮어쓴다. WAIT/WAIT LOCK 중 자동으로
    # 격발해 표적이 출발하기 전에 시험을 끝내는 것을 막는다.
    auto_fire_requires_target_move: false
    # 지연 보정 (2026-09-21). 영상은 촬영 → FCS 처리 → 격발까지 수십 ms 묵는다
    # (35 m 측정: 모의 시각 중앙값 36~50 ms). 이동 표적은 그동안 움직이므로 격발 순간
    # 조준해를 그 시각 기준으로 다시 풀고, 그 순간의 총구 방향(TF 최신값)으로 정렬을
    # 다시 판정한 뒤 쏜다. HUD 레티클은 촬영 시각 기준 그대로다: 같은 영상 속 총구도
    # 촬영 시각의 것이라, 포탑을 돌려 따라가는 중이면 상대 정렬이 격발까지 유지되기
    # 때문이다(레티클만 앞당기면 과보정된다).
    # false 면 예전처럼 마지막 영상의 판정으로 쏜다(보정 전후 비교용). 정지 표적에는 영향이 없다.
    latency_compensation: true
    # 영상/추적 위치 지연 0.17 s. 0.28 s(후행 0.093 m ≈ 0.11 s 추가)는 2026-10-02 실격발 반복에서
    # 조준오차 중앙값 27~32 px -> 55~69 px, READY 4~5.5% -> 2~3%로 악화시켜 되돌렸다
    # (180초 창 기준 0.17 s: 전체 69.8%·전환부 64.2%, 0.28 s: 65.6%·53.8%).
    motion_measurement_lag_s: 0.17
    # MOVE 중 장기 OLS와 최근 6프레임 속도가 크게 다르거나 궤적 잔차가 크면
    # 방향 전환/측정 잡음 구간으로 보고 READY와 격발을 fail-closed 한다.
    motion_ready_max_velocity_disagreement_mps: 0.75
    motion_ready_max_fit_rmse_m: 0.20
    motion_ready_min_history_count: 6
    # 장기 OLS와 최근 6프레임의 횡속도가 모두 이 값(m/s)보다 크면서 부호가 반대이면 방향 전환에 걸친
    # 해로 보고 차단한다. 음수면 검사 끔(기본). 2026-10-02 실격발 시험에서 속도 불일치 게이트가 이미 부호 반대 해를
    # 걸러(검사 OFF 31발 중 0발) 효과가 확인되지 않아 끈다.
    motion_ready_lateral_sign_deadband_mps: -1.0
    # 추정 횡속도가 직전 2 s 의 75퍼센타일 × 이 비율 아래로 급락하면 방향 전환에 걸친 해로 보고 READY 를
    # 차단한다. 전환 후 0.3~0.6 s 에 속도 추정이 0 근처로 수렴해 조준점이 0.5~0.7 m 뒤처지는 구간(17발
    # 0명중)을 겨냥한다. <=0 이면 끔.
    # 2026-10-03: 알고리즘 변경 원복 요청에 따라 비활성화.
    motion_ready_speed_collapse_ratio: 0.0
    motion_ready_speed_collapse_window_s: 2.0
    # 표적 운동 추정기의 기동 감지 (2026-09-22). 등속 추정기는 최근 20개 샘플(약 1.2 s)에 직선을
    # 맞추므로 표적이 방향을 바꾸면 약 0.5 s 동안 리드가 이전 방향으로 간다. 켜면 새 측정이 예측과
    # 시선에 수직으로 maneuver_gate_mrad 넘게 두 번 연속 어긋날 때 오래된 기록을 버린다.
    # 기록 재생 비교(benchmarks/sim_measurement/estimator_replay.py)에서 리드가 명중 반경 안에 드는
    # 비율 43 % -> 78 %. 이번 왕복 기동 영상에서 방향 전환 뒤 리드 지연이 확인되어 기본으로 켠다.
    maneuver_reset: true
    maneuver_gate_mrad: 10.0
    # 격발 순간 마지막 영상 나이의 이동평균(진단용, 격발 이벤트에 실린다).
    fire_latency_initial_s: 0.04
    fire_latency_ema_alpha: 0.05
    # HUD 상 KILL/MISS 이펙트를 얼마나 오래 표시할지(초).
    impact_effect_hold_s: 0.35

    # ── 3단계: Gazebo 실측(ground truth) 연동 ───────────────────────────
    # Hit/Kill 판정은 FCS 자신의 표적 추정치가 아니라 이 토픽으로 들어오는
    # Gazebo 실측 위치를 기준으로 한다(왜 그런지는 fire_control.py 모듈
    # docstring 참고). drone_sim/models/drone/model.sdf 에 추가한 PosePublisher
    # 플러그인이 이 이름으로 발행한다고 "가정"한 값이다 — gz-sim 버전에 따라
    # 실제 토픽 이름이 다를 수 있으므로 WSL2 에서 `gz topic -l` 로 반드시 확인할
    # 것. smash_scene.launch.py 에 이 토픽을 geometry_msgs/PoseStamped 로
    # 브리지하는 parameter_bridge 노드를 추가해 두었다.
    ground_truth_pose_topic: "/model/drone/pose"
    # 이보다 오래된 ground truth 는 판정에 쓰지 않고 UNVERIFIED 로 남긴다.
    ground_truth_timeout_s: 0.5
    # Gazebo world 프레임 -> base_footprint 프레임 변환(포탑 스폰 변환).
    # view.launch.py 의 `ros_gz_sim create -topic robot_description
    # -name ciws_turret -z 0.05` 와 반드시 일치해야 한다(x=y=0, 회전 없음이
    # 현재 기본값). 스폰 인자를 바꾸면 이 값도 반드시 함께 바꿀 것 — 이 동기화는
    # 코드로 강제되지 않는다.
    turret_world_translation_m: [0.0, 0.0, 0.05]
    turret_world_yaw_rad: 0.0

# Gazebo 포탑 구동 전용 노드. SMASH 알고리즘과 별도 프로세스에서 실행되므로
# YOLO 추론 시간이 길어져도 관절 명령 발행 주기가 막히지 않는다.
turret_command:
  ros__parameters:
    use_sim_time: true
    # 선회 명령(증분 rad, pan=888 이면 탐색 자세 복귀, 999 이면 수평). 뷰어 R 키와 측정 도구가 쓴다.
    slew_topic: "/smash_fcs/slew_cmd"
    aim_track_topic: "/smash_fcs/aim_track"
    command_topic: "/turret_controller/commands"
    command_rate_hz: 60.0
    pan_max_rate_rad_s: 3.0
    tilt_max_rate_rad_s: 2.5
    tilt_min_rad: 0.0
    tilt_max_rad: 1.4835298641951802
    search_pan_rad: 0.0
    search_tilt_rad: 0.38
    pan_dither_rad: 0.0005
    # 시뮬레이터의 Pan/Tilt는 실제 제품 기능이 아니라 사수가 총을 움직이는 동작의
    # 대체물이다. FCS가 발행하는 신뢰 가능한(STABLE) 리드 방향으로 폐루프 추종한다.
    # 격발은 FCS 의 READY 게이트가 결정한다.
    # 3 km/h, 35 m, 0.2 rad 왕복 시험에서 진행 방향별 정상상태 오차가 약 +/-14 px,
    # 즉 모의 시각 약 0.19 s 지연으로 측정됐다. aim_track의 모의 시각 차분으로
    # 리드 방향 각속도를 구해 이 시간만큼 목표각을 앞당긴다.
    aim_feedforward_s: 0.19
    # 탐지 잡음이나 재포착 점프를 미분한 값이 큰 선회 명령이 되지 않도록 제한한다.
    aim_feedforward_max_rate_rad_s: 0.5
    # 틸트 리드 시간. 0.0 = 틸트 피드포워드 끔(기본). 수평으로 움직이는 표적은 실제 수직 각속도가 0 이고
    # 측정값은 잡음이라, 팬과 같은 0.19 s 외삽을 걸면 포가 위아래로 떨었다(2026-10-03 라이브 기록 재생:
    # 틸트 속도 rms 32.7 -> 17.8 px/s, 정렬 오차 중앙값 3.0 -> 2.1 px). 수직으로 기동하는 표적이면 올린다.
    aim_tilt_feedforward_s: 0.0
    # 목표는 검출기 갱신 프레임(약 0.33 s 간격)에서만 바뀐다. 그 사이를 마지막 측정 각속도로 이어
    # 움직이는 최대 시간[s]. 0 이면 끄고 예전처럼 갱신 사이에 포가 멈춘다. 갱신 사이 멈춤은 포가 한 번에
    # 15 px 정도(방향 전환 땐 40 px) 튀었다 서는 계단 동작을 만들었다. 재생 비교: 팬 정렬 오차 중앙값
    # 5.3 -> 2.8 px, p90 12.1 -> 8.8 px, 0.1 s 당 명령 변화 p90 16.3 -> 8.1 px.
    aim_extrapolate_s: 1.0
    # 연속 이동에 쓰는 각속도의 이전 값 가중치(EMA, 0 = 원시값). 방향 전환 직후에는 이전 방향으로 조금 더 간다.
    aim_rate_smoothing: 0.5
    # 선회 명령(R 키·프리셋·측정 도구) 직후에는 그 명령을 우선하고, 이후 리드점 추종으로 복귀한다.
    slew_override_s: 0.75
