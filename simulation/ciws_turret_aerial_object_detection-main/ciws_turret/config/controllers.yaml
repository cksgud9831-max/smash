controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    turret_controller:
      type: position_controllers/JointGroupPositionController

turret_controller:
  ros__parameters:
    joints:
      - turret_pan_joint
      - turret_tilt_joint
